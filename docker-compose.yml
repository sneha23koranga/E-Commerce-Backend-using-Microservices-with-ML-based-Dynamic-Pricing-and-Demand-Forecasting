services:

  # ---------- Infrastructure ----------
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8181"
      KC_HOSTNAME: http://keycloak:8181
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8181:8181"
    volumes:
      - keycloak-data:/opt/keycloak/data

  # ---------- Your Spring Boot services ----------
  discovery-server:
    build:
      context: .
      args:
        SERVICE: discovery-server
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    ports:
      - "8761:8761"

  product-service:
    build:
      context: .
      args:
        SERVICE: product-service
    restart: on-failure
    depends_on:
      - discovery-server
      - mongo
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      SERVER_PORT: 8084
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/product_sevice
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  inventory-service:
    build:
      context: .
      args:
        SERVICE: inventory-service
    restart: on-failure
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/inventory_service?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  order-service:
    build:
      context: .
      args:
        SERVICE: order-service
    restart: on-failure
    depends_on:
      discovery-server:
        condition: service_started
      mysql:
        condition: service_healthy
      kafka:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/order_service?createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

  api-gateway:
    build:
      context: .
      args:
        SERVICE: api-gateway
    restart: on-failure
    depends_on:
      - discovery-server
      - keycloak
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      SERVER_PORT: 8080
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: http://keycloak:8181/realms/spring-boot-microservices-realms
      SPRING_APPLICATION_JSON: '{"eureka":{"client":{"service-url":{"defaultZone":"http://discovery-server:8761/eureka"}}}}'
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    ports:
      - "8080:8080"

volumes:
  mongo-data:
  mysql-data:
  keycloak-data: